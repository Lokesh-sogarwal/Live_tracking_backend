# Render blueprint for the Node backend. Secrets are set in the Render dashboard
# (sync: false), never committed. Deploy alongside the Flask service until cutover.
services:
  - type: web
    name: live-tracking-api-node
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend-node
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: s3
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: UPLOAD_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Exactly one worker instance. A Mongo lease also prevents duplicate runs if a second
  # instance is started by mistake.
  - type: worker
    name: live-tracking-worker-node
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend-node
    buildCommand: npm ci --omit=dev
    startCommand: node src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: s3
      - key: SCHEDULE_CRON_TIME
        value: "10:05"
      - key: SIMULATION_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPLOAD_BUCKET
        sync: false
      - key: ORS_API_KEY
        sync: false
