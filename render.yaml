# Render blueprint for the Node backend. Secrets are set in the Render dashboard
# (sync: false), never committed. Deploy alongside the Flask service until cutover.
# Free plan alternative (no background workers on free): ONE web service with start command
# `node src/server.js` and RUN_WORKER=true (plus SIMULATION_ENABLED=true if you want simulated
# buses). A free instance sleeps after ~15 min without traffic; jobs pause while it sleeps —
# set KEEP_ALIVE_ENABLED=true so the API pings its own /health/live every 10 min (Render sets
# RENDER_EXTERNAL_URL), and add an external monitor on /health/live to wake it after restarts.
# This file sits at the root of the backend repository (Live_tracking_backend), which *is*
# the backend: no rootDir. (rootDir: backend-node pointed at a folder that doesn't exist there.)
services:
  - type: web
    name: live-tracking-api-node
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: s3
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: UPLOAD_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Exactly one worker instance. A Mongo lease also prevents duplicate runs if a second
  # instance is started by mistake.
  - type: worker
    name: live-tracking-worker-node
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: s3
      # Daily timetable run at midnight IST, filling today + 7 days (docs/ARCHITECTURE.md).
      - key: SCHEDULE_CRON_TIME
        value: "00:00"
      - key: SCHEDULE_DAYS_AHEAD
        value: "7"
      - key: SIMULATION_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPLOAD_BUCKET
        sync: false
      - key: ORS_API_KEY
        sync: false
